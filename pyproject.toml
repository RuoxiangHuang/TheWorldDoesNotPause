[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-world-does-not-pause"
version = "0.1.0"
description = "Dynamic-LIBERO, Dynamic-RoboTwin, and FastWAM PACE"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "einops==0.8.1",
  "hydra-core==1.3.2",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "pillow==12.0.0",
  "safetensors==0.5.3",
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "transformers==4.49.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.package-dir]
"" = "FastWAM/src"

[tool.setuptools.packages.find]
where = ["FastWAM/src"]
include = ["fasterwam*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = [
  "FastWAM/tests",
  "Benchmarks/benchmarks/dynamic_libero/tests",
  "Benchmarks/benchmarks/dynamic_robotwin/tests",
  "Benchmarks/benchmarks/common/tests",
]
pythonpath = ["FastWAM/src", "Benchmarks"]
