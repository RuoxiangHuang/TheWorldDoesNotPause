# @package _global_
# PACE for FastWAM (Policy Acceleration through Cached Execution).
# Paper name. Same controllers as accel=ours and accel=default:
# compile + text_cache + step_cache. Visual / video-token / residual
# caches stay off; encoder and residual presets are p0, p1, action0, full.
accel:
  enabled: true
  verbose: true

  text_cache:
    enabled: true
    max_entries: 64

  step_cache:
    enabled: true
    threshold: 0.20
    max_consecutive_skips: 2
    cold_steps: 2

  compile:
    enabled: true
    mode: reduce-overhead
    predict: true
    prefill: true

  video_token_cache:
    enabled: false

  vae_cache:
    enabled: false

  obs_pipeline:
    enabled: false

  chunk_residual_cache:
    enabled: false

