# @package _global_
# Ablation: ours without text_cache. compile + step_cache stay at the ours settings.
accel:
  enabled: true
  verbose: true

  text_cache:
    enabled: false
    max_entries: 64

  step_cache:
    enabled: true
    threshold: 0.20
    max_consecutive_skips: 2
    cold_steps: 2

  compile:
    enabled: true
    mode: reduce-overhead
    predict: true
    prefill: true

  video_token_cache:
    enabled: false

  vae_cache:
    enabled: false

  obs_pipeline:
    enabled: false

  chunk_residual_cache:
    enabled: false

