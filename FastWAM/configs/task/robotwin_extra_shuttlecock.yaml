# @package _global_

defaults:
  - override /data: robotwin_extra
  - override /model: fastwam
  - _self_

batch_size: 8
num_workers: 2

model:
  mot_checkpoint_mixed_attn: false

lr_scheduler_type: cosine
learning_rate: 2.0e-5
num_epochs: 8
max_steps: 600
log_every: 5
save_every: 100
eval_every: 100000

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
freeze_video_expert: true
resume: /DATA/YuanZhen/FasterWAM/checkpoints/fastwam_release/robotwin_uncond_3cam_384.pt
wandb:
  enabled: false
